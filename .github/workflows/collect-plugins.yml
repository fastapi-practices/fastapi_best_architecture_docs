name: Collect Plugins Data

on:
  schedule:
    # 每小时更新一次插件市场数据
    # 使用非整点时刻，避开 GitHub 定时任务的调度高峰
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-plugins-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 恢复上一轮的采集状态
      # 状态中保存了 ETag 缓存与插件首次收录时间，丢失会导致每轮都重新拉取全量数据
      - name: Restore previous state
        run: |
          git fetch --depth=1 origin +refs/heads/marketplace-data:refs/remotes/origin/marketplace-data || true
          if git cat-file -e origin/marketplace-data:marketplace-state.json 2>/dev/null; then
            git show origin/marketplace-data:marketplace-state.json > marketplace-state.json
            echo "restored previous state"
          else
            echo '{}' > marketplace-state.json
            echo "no previous state, starting fresh"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect plugins data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/marketplace/collect.mjs

      # 数据发布到独立分支，站点运行时直接读取
      # 避免每小时触发一次站点构建
      - name: Publish data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan marketplace-data
          git reset
          # 采集产物在 .gitignore 中，必须强制添加
          git add -f plugins-market.json marketplace-state.json
          git commit -m "chore: update plugins marketplace data"
          git push --force origin marketplace-data
